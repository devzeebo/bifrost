services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: bifrost
      POSTGRES_DB: bifrost
    ports:
      - "5432:5432"
    volumes:
      - bifrost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifrost -d bifrost"]
      interval: 5s
      timeout: 5s
      retries: 10

  work-items:
    build:
      context: ..
      dockerfile: net/Domains/Bifrost.WorkItems/Dockerfile
    environment:
      ConnectionStrings__Marten: Host=postgres;Port=5432;Database=bifrost;Username=bifrost;Password=bifrost
      Bifrost__BusSocket: /run/bifrost/bus.sock
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    volumes:
      - bus_sock:/run/bifrost
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: bifrost
      RABBITMQ_DEFAULT_PASS: bifrost
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  work-items-bus:
    build:
      context: ..
      dockerfile: net/Infrastructure/Bifrost.MessageBus.RabbitMq/Dockerfile
    environment:
      Rpc__SocketPath: /run/bifrost/bus.sock
      Rpc__InstanceId: work-items
      Rpc__Role: primary
      Bus__Address: work-items
    volumes:
      - bus_sock:/run/bifrost
    depends_on:
      work-items:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  orchestrator:
    build:
      context: ..
      dockerfile: net/Domains/Bifrost.Orchestrator/Dockerfile
    environment:
      ConnectionStrings__Marten: Host=postgres;Port=5432;Database=bifrost;Username=bifrost;Password=bifrost
      Bifrost__BusSocket: /run/bifrost/bus.sock
      ASPNETCORE_URLS: http://+:8080
      Gateway__BaseUrl: ${BIFROST_GATEWAY_BASE_URL:-https://bifrost-gateway-test.improving.app}
      Gateway__VirtualKey: ${BIFROST_API_KEY:-}
      Gateway__QuotaAccessToken: ${BIFROST_QUOTA_ACCESS_TOKEN:-}
    ports:
      - "8081:8080"
    volumes:
      - orchestrator_bus_sock:/run/bifrost
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator-bus:
    build:
      context: ..
      dockerfile: net/Infrastructure/Bifrost.MessageBus.RabbitMq/Dockerfile
    environment:
      Rpc__SocketPath: /run/bifrost/bus.sock
      Rpc__InstanceId: orchestrator
      Rpc__Role: primary
      Bus__Address: orchestrator
    volumes:
      - orchestrator_bus_sock:/run/bifrost
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker-node:
    build:
      context: ..
      dockerfile: net/Domains/Bifrost.WorkerNode/Dockerfile
    environment:
      Bifrost__BusSocket: /run/bifrost/bus.sock
      Bifrost__OutboxPath: /var/lib/bifrost/worker-node.db
      Bifrost__NodeId: 11111111-1111-1111-1111-111111111111
    volumes:
      - worker_bus_sock:/run/bifrost
      - worker_outbox:/var/lib/bifrost
    depends_on:
      - worker-bus

  worker-bus:
    build:
      context: ..
      dockerfile: net/Infrastructure/Bifrost.MessageBus.RabbitMq/Dockerfile
    environment:
      Rpc__SocketPath: /run/bifrost/bus.sock
      Rpc__InstanceId: worker
      Rpc__Role: primary
      Bus__Address: worker
      Bus__NodeId: 11111111-1111-1111-1111-111111111111
    volumes:
      - worker_bus_sock:/run/bifrost
    depends_on:
      rabbitmq:
        condition: service_healthy

  skills:
    build:
      context: ..
      dockerfile: net/Domains/Bifrost.Skills/Dockerfile
    environment:
      ConnectionStrings__Marten: Host=postgres;Port=5432;Database=bifrost;Username=bifrost;Password=bifrost
      Bifrost__BusSocket: /run/bifrost/bus.sock
      ASPNETCORE_URLS: http://+:8080
      Ai__ApiKey: ${BIFROST_AI_API_KEY:-unset}
      Ai__BaseUrl: ${BIFROST_AI_BASE_URL:-https://api.fireworks.ai/inference/v1/}
      Ai__Model: ${BIFROST_AI_MODEL:-accounts/fireworks/models/llama-v3p1-70b-instruct}
    ports:
      - "8082:8080"
    volumes:
      - skills_bus_sock:/run/bifrost
    depends_on:
      postgres:
        condition: service_healthy

  skills-bus:
    build:
      context: ..
      dockerfile: net/Infrastructure/Bifrost.MessageBus.RabbitMq/Dockerfile
    environment:
      Rpc__SocketPath: /run/bifrost/bus.sock
      Rpc__InstanceId: skills
      Rpc__Role: primary
      Bus__Address: skills
    volumes:
      - skills_bus_sock:/run/bifrost
    depends_on:
      skills:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  workflows:
    build:
      context: ..
      dockerfile: net/Domains/Bifrost.Workflows/Dockerfile
    environment:
      ConnectionStrings__Marten: Host=postgres;Port=5432;Database=bifrost;Username=bifrost;Password=bifrost
      Bifrost__BusSocket: /run/bifrost/bus.sock
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8083:8080"
    volumes:
      - workflows_bus_sock:/run/bifrost
    depends_on:
      postgres:
        condition: service_healthy

  workflows-bus:
    build:
      context: ..
      dockerfile: net/Infrastructure/Bifrost.MessageBus.RabbitMq/Dockerfile
    environment:
      Rpc__SocketPath: /run/bifrost/bus.sock
      Rpc__InstanceId: workflows
      Rpc__Role: primary
      Bus__Address: workflows
    volumes:
      - workflows_bus_sock:/run/bifrost
    depends_on:
      workflows:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  bifrost_pgdata:
  rabbitmq_data:
  bus_sock:
  orchestrator_bus_sock:
  worker_bus_sock:
  worker_outbox:
  skills_bus_sock:
  workflows_bus_sock:
