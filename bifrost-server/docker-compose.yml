services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: bifrost
      POSTGRES_DB: bifrost
    ports:
      - "5432:5432"
    volumes:
      - bifrost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifrost -d bifrost"]
      interval: 5s
      timeout: 5s
      retries: 10

  work-items:
    build:
      context: ..
      dockerfile: net/Bifrost.WorkItems/Dockerfile
    environment:
      ConnectionStrings__Marten: Host=postgres;Port=5432;Database=bifrost;Username=bifrost;Password=bifrost
      BIFROST_SOCKET: /run/bifrost/bus.sock
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    volumes:
      - bus_sock:/run/bifrost
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: bifrost
      RABBITMQ_DEFAULT_PASS: bifrost
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  work-items-bus:
    build:
      context: ..
      dockerfile: net/Bifrost.MessageBus.RabbitMq/Dockerfile
    environment:
      BIFROST_SOCKET: /run/bifrost/bus.sock
      BIFROST_INSTANCE_ID: work-items
      BIFROST_ROLE: primary
      BUS_ENDPOINT: amqp://bifrost:bifrost@rabbitmq:5672/
      BUS_SUBSCRIBERS: work-items,orchestrator,worker
      BUS_COMMAND_ADDRESS: work-items
    volumes:
      - bus_sock:/run/bifrost
    depends_on:
      work-items:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  orchestrator:
    build:
      context: ..
      dockerfile: net/Bifrost.Orchestrator/Dockerfile
    environment:
      ConnectionStrings__Marten: Host=postgres;Port=5432;Database=bifrost;Username=bifrost;Password=bifrost
      BIFROST_SOCKET: /run/bifrost/bus.sock
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8081:8080"
    volumes:
      - orchestrator_bus_sock:/run/bifrost
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator-bus:
    build:
      context: ..
      dockerfile: net/Bifrost.MessageBus.RabbitMq/Dockerfile
    environment:
      BIFROST_SOCKET: /run/bifrost/bus.sock
      BIFROST_INSTANCE_ID: orchestrator
      BIFROST_ROLE: primary
      BUS_ENDPOINT: amqp://bifrost:bifrost@rabbitmq:5672/
      BUS_SUBSCRIBERS: work-items,orchestrator,worker
      BUS_COMMAND_ADDRESS: work-items
    volumes:
      - orchestrator_bus_sock:/run/bifrost
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker-node:
    build:
      context: ..
      dockerfile: net/Bifrost.WorkerNode/Dockerfile
    environment:
      BIFROST_SOCKET: /run/bifrost/bus.sock
      BIFROST_OUTBOX_PATH: /var/lib/bifrost/worker-node.db
    volumes:
      - worker_bus_sock:/run/bifrost
      - worker_outbox:/var/lib/bifrost
    depends_on:
      - worker-bus

  worker-bus:
    build:
      context: ..
      dockerfile: net/Bifrost.MessageBus.RabbitMq/Dockerfile
    environment:
      BIFROST_SOCKET: /run/bifrost/bus.sock
      BIFROST_INSTANCE_ID: worker
      BIFROST_ROLE: primary
      BUS_ENDPOINT: amqp://bifrost:bifrost@rabbitmq:5672/
      BUS_SUBSCRIBERS: work-items,orchestrator,worker
      BUS_COMMAND_ADDRESS: work-items
    volumes:
      - worker_bus_sock:/run/bifrost
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  bifrost_pgdata:
  rabbitmq_data:
  bus_sock:
  orchestrator_bus_sock:
  worker_bus_sock:
  worker_outbox:
